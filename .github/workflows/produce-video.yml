name: Produce Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video konusu (yeni üretim için)"
        required: false
        type: string
      workflow_id:
        description: "Devam edilecek workflow ID (mevcut üretim için)"
        required: false
        type: string
      stop_after:
        description: "Bu adımdan sonra dur (boş bırakılırsa sona kadar çalışır)"
        required: false
        type: string
      max_cost:
        description: "Maksimum maliyet (USD)"
        required: false
        type: string
        default: "2.0"

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Produce video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_COST_PER_VIDEO: ${{ inputs.max_cost }}
          TOPIC: ${{ inputs.topic }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          STOP_AFTER: ${{ inputs.stop_after }}
        run: |
          args=()
          if [ -n "$WORKFLOW_ID" ]; then
            args+=(--id "$WORKFLOW_ID")
          else
            args+=(--topic "$TOPIC")
          fi
          if [ -n "$STOP_AFTER" ]; then
            args+=(--stop-after "$STOP_AFTER")
          fi
          npm run produce -- "${args[@]}"
