name: Produce Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Video konusu (yeni üretim için)"
        required: false
        type: string
      workflow_id:
        description: "Devam edilecek workflow ID (mevcut üretim için)"
        required: false
        type: string
      stop_after:
        description: "Bu adımdan sonra dur (boş bırakılırsa sona kadar çalışır)"
        required: false
        type: string
      max_cost:
        description: "Maksimum maliyet (USD)"
        required: false
        type: string
        default: "2.0"
      scene_count:
        description: "Sahne sayısı (boş bırakılırsa 6-9 arası otomatik)"
        required: false
        type: string
      production_note:
        description: "Ton/format için ek not (konu olarak kullanılmaz)"
        required: false
        type: string
      character:
        description: "Sabit karakter PNG yolu (ör. assets/characters/wandering-family.png)"
        required: false
        type: string
      video:
        description: "Statik görsel yerine Seedance ile akan video klip üret (maliyetli)"
        required: false
        type: boolean
        default: false

jobs:
  produce:
    runs-on: ubuntu-latest
    # Akan video modu (Seedance) sahne başına dakikalar sürebilir — normal
    # (statik görsel) üretimler bu sürenin çok altında tamamlanır.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Produce video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          SEEDANCE_MODEL_ID: ${{ secrets.SEEDANCE_MODEL_ID }}
          SEEDANCE_PRICE_PER_SECOND_USD: ${{ secrets.SEEDANCE_PRICE_PER_SECOND_USD }}
          MAX_COST_PER_VIDEO: ${{ inputs.max_cost }}
          TOPIC: ${{ inputs.topic }}
          WORKFLOW_ID: ${{ inputs.workflow_id }}
          STOP_AFTER: ${{ inputs.stop_after }}
          SCENE_COUNT: ${{ inputs.scene_count }}
          PRODUCTION_NOTE: ${{ inputs.production_note }}
          CHARACTER: ${{ inputs.character }}
          VIDEO: ${{ inputs.video }}
        run: |
          args=()
          if [ -n "$WORKFLOW_ID" ]; then
            args+=(--id "$WORKFLOW_ID")
          else
            if [ -n "$TOPIC" ]; then
              args+=(--topic "$TOPIC")
            fi
          fi
          if [ -n "$STOP_AFTER" ]; then
            args+=(--stop-after "$STOP_AFTER")
          fi
          if [ -n "$SCENE_COUNT" ]; then
            args+=(--scenes "$SCENE_COUNT")
          fi
          if [ -n "$PRODUCTION_NOTE" ]; then
            args+=(--production-note "$PRODUCTION_NOTE")
          fi
          if [ -n "$CHARACTER" ]; then
            args+=(--character "$CHARACTER")
          fi
          if [ "$VIDEO" = "true" ]; then
            args+=(--video)
          fi
          npm run produce -- "${args[@]}"
